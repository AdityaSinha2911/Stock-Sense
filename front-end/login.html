<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login | StockSense</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			min-height: 100vh;
			background-color: #f4f7f6;
		}

		.login-card {
			max-width: 420px;
			border: 1px solid #e1e8e5;
			border-radius: 12px;
		}

		.brand-mark {
			color: #157347;
			letter-spacing: 0.02em;
		}
	</style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
	<main class="w-100">
		<section class="login-card bg-white shadow-sm mx-auto p-4 p-sm-5" aria-labelledby="login-title">
			<div class="text-center mb-4">
				<div class="brand-mark fw-bold fs-2">StockSense</div>
				<h1 id="login-title" class="h4 mt-3 mb-2">Welcome back</h1>
				<p class="text-secondary mb-0">Sign in to manage your inventory.</p>
			</div>

			<form action="#" method="post">
				<div class="mb-3">
					<label for="email" class="form-label">Email address</label>
					<input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
				</div>

				<div class="mb-2">
					<label for="password" class="form-label">Password</label>
					<input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
				</div>

				<div class="text-end mb-4">
					<a href="#" class="link-success small">Forgot Password?</a>
				</div>

				<button type="submit" class="btn btn-success w-100">Login</button>
			</form>

			<p class="text-center text-secondary small mt-4 mb-0">
				Don't have an account?
				<a href="#" class="link-success fw-semibold text-decoration-none">Sign Up</a>
			</p>
		</section>
	</main>
</body>
</html>
